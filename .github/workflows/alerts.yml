# The alerter. Runs on GitHub's hosted runners.
#
# ⚠ THIS FILE BELONGS IN A PUBLIC REPOSITORY, AND THAT IS THE WHOLE POINT. Public repos
# get unlimited free Actions minutes; private ones are metered at 2,000 a month, and the
# repository this was written in ran out — which is precisely what it must not depend on.
#
# ⚠ AND THE REPOSITORY IT LIVES IN MUST HAVE NO SELF-HOSTED RUNNER. A pull request can
# change a workflow, so a public repo with a self-hosted runner lets a stranger run code
# on your machine. This repo has none and must never get one. Keep it separate from any
# repository that does.
#
# NOTHING SECRET IS IN THIS FILE. Every credential is a repository secret, and the
# holdings themselves can be too — see WATCHLIST_JSON below.
name: market alerts

on:
  # ⚠ NOT ONE OF THESE FIRES ON THE HOUR, AND THAT IS DELIBERATE. GitHub's own
  # documentation says scheduled runs are delayed during high load and names "the start
  # of every hour" as the worst of it. Measured here on 2026-09-23: of roughly twenty-one
  # due fires between midnight and 15:29 UTC, three happened. Nothing failed — the runs
  # simply never started. Moving off :00 is a mitigation, not a fix, which is why
  # alerter.overdue_letter() exists: the letters recover themselves when a slot is missed.
  schedule:
    # The trusted accounts, hourly through the day. Separate from the price scan because
    # people post outside market hours and a Hormuz headline at 3am is the kind this is
    # for. `max_per_run` is what keeps that from becoming a flood.
    #
    # THIS IS ALSO THE RECOVERY VEHICLE, and that is now the more important of its two
    # jobs. It runs round the clock, so a letter whose own slot was dropped has many more
    # chances inside its grace window — see alerter.overdue_letter().
    - cron: "10 * * * *"
    # Urgent scan through the US session and past the bell. Half-hourly is a deliberate
    # ceiling: a dip trigger you learn about 30 minutes late is still actionable, and
    # polling harder mostly buys noise. :07 and :37 rather than :00 and :30 for the load
    # reason above — same cadence, quieter minutes.
    #
    # IT RUNS TO 21:37 SO THE LAST SCAN IS ALWAYS AFTER THE CLOSE. The session ends at
    # 20:00 UTC in summer and 21:00 in winter; stopping at 20:37 would mean that from
    # November the final close of the day is never seen by anything, and the record high
    # this alerter ratchets would be built only from intraday readings taken 23 minutes
    # early. The retired after-the-close letter used to cover that by accident.
    - cron: "7,37 13-21 * * 1-5"

    # ── AND THESE ARE THE LETTERS, IN PAIRS AN HOUR APART. NEITHER IS A MISTAKE ──────
    #
    # NOT ONE CRON HERE SENDS A LETTER. Every one of them runs the price check, and
    # alerter.overdue_letter() sends whatever letter's slot has passed unsent. That is why
    # the times come in pairs: the letters are due at 8:45am and 3:40pm NEW YORK, which is
    # an hour apart in UTC either side of the daylight-saving boundary. In summer the
    # first of each pair sends and the second finds it already gone; in winter the first
    # finds the slot has not arrived and the second sends. No seasonal edit, ever, and no
    # letter arriving an hour and twenty minutes before the close because the clocks moved.
    #
    # Before the open — 8:45am New York, and the week-ahead letter on Mondays.
    - cron: "47 12 * * 1-5"
    - cron: "47 13 * * 1-5"
    # Before the close — 3:40pm New York, twenty minutes before the bell.
    - cron: "42 19 * * 1-5"
    - cron: "42 20 * * 1-5"
    # Sunday: the week in review, and what is coming. 11am New York.
    - cron: "17 15 * * 0"
    - cron: "17 16 * * 0"

    # ONE WEEKEND SCAN, because bitcoin does not stop when the exchanges do. Equities are
    # unchanged from Friday and simply report no move.
    - cron: "17 15 * * 6"
  workflow_dispatch:
    inputs:
      mode:
        description: "check | accounts | preopen | preclose | weekahead | weekly | probe"
        type: choice
        options: ["check", "accounts", "preopen", "preclose", "weekahead", "weekly", "probe"]
        default: "check"
      dry_run:
        description: "print only — send nothing, spend nothing"
        type: boolean
        default: false

permissions:
  contents: write          # the state file is committed; see alerter.py

concurrency:
  # TWO RUNS MUST NOT BOTH DECIDE A TRIGGER IS UNSPENT. They would each send the -10%
  # alert and each commit a state file the other overwrites.
  group: market-alerts
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # anthropic ONLY. Everything else is the standard library, which is why this job
      # takes seconds rather than minutes and why a broken wheel cannot stop a price alert.
      # anthropic for the summary, tzdata so zoneinfo can resolve America/New_York even
      # on an image whose system tz database is missing — the letter slots are defined in
      # market time and an unresolvable zone would stop every letter, not just shift one.
      - name: Install
        run: pip install --quiet anthropic tzdata

      - name: Which mode
        id: mode
        run: |
          # ONLY ONE BRANCH LEFT, AND THAT IS THE POINT. A schedule used to name the
          # letter it sent, which meant the same fact — when a letter is due — lived in a
          # cron string here and in a table in alerter.py, and the two could disagree with
          # nothing failing. Now every scheduled run is a poll, and the poll decides.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "10 * * * *" ]; then
            echo "mode=accounts" >> "$GITHUB_OUTPUT"
          else
            echo "mode=check" >> "$GITHUB_OUTPUT"
          fi

      # OPTIONAL: keep your holdings out of a public repo. Put the whole watchlist.json
      # in a secret named WATCHLIST_JSON and it overwrites the committed one at runtime.
      # Leave the secret unset and the committed file is used as-is.
      - name: Private watchlist, if you set one
        env:
          WATCHLIST_JSON: ${{ secrets.WATCHLIST_JSON }}
        run: |
          if [ -n "$WATCHLIST_JSON" ]; then
            printf '%s' "$WATCHLIST_JSON" > watchlist.json
            python -c "import json;json.load(open('watchlist.json'))" \
              && echo "using the watchlist from the secret"
          else
            echo "using the committed watchlist.json"
          fi

      - name: Run
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          # Defined in sources.py since the price ladder was built and never actually
          # passed through, which is why the holdings block stayed empty after the key
          # existed. A free, rate-limited, read-only key: same risk class as FRED.
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          # ── X_COOKIES IS DELIBERATELY ABSENT, AND THIS IS THE RECORD OF WHY ──────────
          #
          # It is a full-account credential — posting, DMs, settings — and unlike an app
          # password or a spend-capped API key it cannot be scoped down. This repository
          # is PUBLIC: anyone can open a pull request against it, and every dependency
          # this job installs runs with whatever is in this environment. That trade is
          # fine for a key whose worst case is a few dollars and wrong for one whose
          # worst case is account takeover.
          #
          # `xfetch.py` is committed and ready. It belongs on the PRIVATE repo, where the
          # self-hosted Mac runner already lives — there the credential sits behind a
          # repo only its owner can see, and the job can push straight to ntfy without
          # this repo ever holding it. Adding the secret here would undo that.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python alerter.py --${{ steps.mode.outputs.mode }} \
            ${{ inputs.dry_run == true && '--dry-run' || '' }}

      # THE STATE FILE IS THE MEMORY. Without this commit every run starts fresh and the
      # same dip level alerts forever. The watchlist is never committed back — if it came
      # from the secret, committing it would publish the holdings the secret hides.
      - name: Remember what fired
        if: ${{ always() && inputs.dry_run != true }}
        run: |
          git checkout -- watchlist.json 2>/dev/null || true
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json || true
          git diff --cached --quiet && echo "state unchanged" && exit 0
          git commit -m "alerts: state after $(date -u +%Y-%m-%dT%H:%M)Z [skip ci]"
          for i in 1 2 3 4; do
            git push && exit 0
            sleep $((i * 3))
            git pull --rebase --autostash || true
          done
          echo "could not push state after 4 attempts" >&2
